<div class="home-block posts">
  <div class="home-block__header posts__header">
    <h3 class="home-block__header_title posts_title">Недавние посты</h3>
    <a
      class="home-block__header_link posts_link"
      [routerLink]="['/blog']"
      aria-label="Перейти ко всем постам"
    >
      Посмотреть все
    </a>
  </div>
  <div class="posts__content">
    <ng-container *ngFor="let post of recentPosts">
      <div class="posts__card">
        <h3 class="posts__card_title">{{ post.title }}</h3>
        <span class="posts__card_date">
          {{ post.date | date : "dd.MM.yyyy" }}
        </span>
        <ng-container *ngIf="post.theme">
          <span class="posts__card_line">|</span>
          <span class="posts__card_theme"> {{ post.theme }} </span>
        </ng-container>
        <p class="posts__card_text">{{ post.description }}</p>
      </div>
    </ng-container>
    <ng-container *ngIf="recentPosts.length === 0">
      <p class="home-block__warning posts__warning">
        Ой! Кажется постов ещё нет!
      </p>
    </ng-container>
  </div>
</div>
